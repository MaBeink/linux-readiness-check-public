name: Programm bewerten / Rate a program
description: Teile deine Erfahrung, wie gut ein Programm unter Linux läuft. / Share how well a program runs on Linux.
title: "[Bewertung] "
labels: ["bewertung"]
body:
  - type: markdown
    attributes:
      value: |
        Danke fürs Mitmachen! Bitte bewerte nur Programme, die du unter Linux selbst ausprobiert hast.
        Schreibe keine persönlichen Daten in dieses Formular, es ist öffentlich.

        Thank you for contributing! Only rate programs you have tried on Linux yourself.
        Do not write personal data in this form, it is public. You can answer in English.
  - type: input
    id: program
    attributes:
      label: Programm / Program
      description: Name, wie er unter Windows installiert erscheint. / Name as installed on Windows.
      placeholder: zum Beispiel Affinity Photo 2
    validations:
      required: true
  - type: dropdown
    id: rating
    attributes:
      label: Wie läuft es unter Linux? / How does it run on Linux?
      options:
        - läuft / works (ohne Probleme oder mit nativer Version)
        - Umweg / workaround (mit Einschränkungen, Web-Version, Wine/Proton oder Alternative)
        - schwierig / difficult (läuft nicht oder nur mit großem Aufwand)
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Lösung oder Alternative / Solution or alternative
      description: Wie hast du es zum Laufen gebracht, oder was nutzt du stattdessen?
      placeholder: zum Beispiel läuft über Flatpak, oder Alternative GIMP
  - type: input
    id: distribution
    attributes:
      label: Distribution
      placeholder: zum Beispiel Linux Mint 22, Fedora 41, CachyOS
  - type: checkboxes
    id: consent
    attributes:
      label: Veröffentlichung / Publication
      options:
        - label: Ich bin einverstanden, dass meine Angaben unter CC BY 4.0 in die Programmliste einfließen. / I agree that my information is added to the program list under CC BY 4.0.
          required: true
